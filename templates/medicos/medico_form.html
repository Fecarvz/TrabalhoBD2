{% extends "base.html" %}

{% block title %}{{ form_action }} Médico{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ form_action }} Médico</h1>
    <form method="POST" action="{{ request.path }}">

        <div class="mb-4">
            <label for="crm" class="form-label">CRM <span class="text-red-500">*</span></label>
            <input type="text" name="crm" id="crm" value="{{ medico.crm if medico else '' }}"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 {% if form_action == 'Editar' and medico.crm %}bg-gray-100{% endif %}"
                   required maxlength="20"
                   {% if form_action == 'Editar' and medico.crm %}readonly{% endif %}>
            {% if form_action == 'Editar' and medico.crm %}
            <p class="text-xs text-gray-500 mt-1">CRM não pode ser alterado.</p>
            {% endif %}
        </div>

        <div class="mb-4">
            <label for="nome" class="form-label">Nome Completo <span class="text-red-500">*</span></label>
            <input type="text" name="nome" id="nome" value="{{ medico.nome if medico else '' }}"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   required>
        </div>

        <div class="mb-4">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="tel" name="telefone" id="telefone" value="{{ medico.telefone if medico else '' }}"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="mt-6 flex items-center justify-end gap-x-4">
            <a href="{{ url_for('medicos_list') }}"
               class="inline-block px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-100 transition">
                Cancelar
            </a>
            <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                {{ 'Salvar Alterações' if form_action == 'Editar' else 'Adicionar Médico' }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
